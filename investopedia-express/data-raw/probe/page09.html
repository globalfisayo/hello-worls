    <script>
      (function () {
        try {
          // TEMP: mirror DARK_MODE_FEATURE_TOGGLE (highestEnvironment: 'staging').
          // ThemeProvider/ModeToggle ignore stored dark/system when the toggle is off, but this
          // script runs first â without this gate, prod/preprod flash dark UI from localStorage
          // before React resets <html>. Remove when dark mode ships to prod (raise/remove toggle).
            var viteEnv = 'prod';
          if (viteEnv === 'prod' || viteEnv === 'preprod') return;

          // Keep in sync with NON_THEMED_PREFIXES in ThemeProvider
          var nonThemedPrefixes = [
            '/embed',
            '/team-access',
            '/render',
            '/pixel-code',
            '/partner',
            '/signup',
          ];
          var path = window.location.pathname;
          for (var i = 0; i < nonThemedPrefixes.length; i++) {
            var prefix = nonThemedPrefixes[i];
            if (path === prefix || path.indexOf(prefix + '/') === 0) return;
          }
          var theme = localStorage.getItem('podscribe-ui-theme') || 'light';
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <script>
      // Function to check and log the loading status of JS files in googlebot
      function trackJSDownloads() {
          if (!window.performance || !performance.getEntriesByType) {
              console.warn('Performance API not supported.');
              return;
          }

          var resources = performance.getEntriesByType('resource');

          // Filter for JavaScript files
          var jsFiles = resources.filter((entry) => entry.initiatorType === 'script');
          var data = jsFiles.map((js) => {
              var loadedFromCache = js.transferSize === 0 && (js.encodedBodySize || 0) > 0;
              return { name: js.name, status: loadedFromCache ? 'cached' : 'downloaded' };
          });

          // fetch('/api/send-logs-to-aws', {
          //     body: JSON.stringify({ data: data.map(log => log.name + ": " + log.status) }),
          //     headers: { 'Content-Type': 'application/json' },
          //     method: "POST",
          // })
      }


      // Run the function after the page is fully loaded
      window.addEventListener('load', () => {
        var botPattern = "(googlebot\/|bot|Googlebot-Mobile|Googlebot-Image|Google favicon|Mediapartners-Google)";
        var botRegex = new RegExp(botPattern, 'i');
        var userAgent = navigator.userAgent;
        if (botRegex.test(userAgent)) {
          console.log('Tracking JavaScript downloads for googlebot:');
          trackJSDownloads();
        }
      });
    </script>
