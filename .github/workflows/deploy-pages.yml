name: Deploy CoffeeChat to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Data refreshes commit with GITHUB_TOKEN, which never triggers a push event,
  # so redeploy whenever one of them finishes on master.
  workflow_run:
    workflows: ["Investopedia Express data pipeline", "Investopedia Express transcripts"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
