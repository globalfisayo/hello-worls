name: Investopedia Express data pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode (probe | full | feed | extract | prices | logos | index)"
        required: false
        default: "full"
  push:
    branches:
      - claude/investopedia-podcast-stocks-5p6fhw
    paths:
      - "investopedia-express/pipeline/**"
      - ".github/workflows/investopedia-data.yml"
  schedule:
    # Mondays 13:00 UTC, after the new episode is usually posted
    - cron: "0 13 * * 1"

permissions:
  contents: write

concurrency:
  group: investopedia-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: investopedia-express/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r investopedia-express/pipeline/requirements.txt

      - name: Run pipeline
        env:
          PIPELINE_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          cd investopedia-express/pipeline
          python run.py --mode "$PIPELINE_MODE" 2>&1 | tee ../data-raw/pipeline.log

      - name: Commit and push data
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Park the generated files, fast-forward to whatever is on the branch now, then re-apply them.
          tmp=$(mktemp -d)
          for d in investopedia-express/data investopedia-express/data-raw investopedia-express/logos; do
            [ -d "$d" ] && mkdir -p "$tmp/$(dirname $d)" && cp -r "$d" "$tmp/$d"
          done
          git checkout -- . && git clean -fdq investopedia-express || true
          git fetch origin "${{ github.ref_name }}"
          git reset -q --hard "origin/${{ github.ref_name }}"
          for d in investopedia-express/data investopedia-express/data-raw investopedia-express/logos; do
            [ -d "$tmp/$d" ] && mkdir -p "$d" && cp -r "$tmp/$d/." "$d/"
          done
          git add -A investopedia-express/data investopedia-express/data-raw investopedia-express/logos
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -q -m "data: refresh Investopedia Express episodes, mentions, prices and logos"
          for i in 1 2 3 4; do
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git fetch origin "${{ github.ref_name }}" && git rebase "origin/${{ github.ref_name }}" || { git rebase --abort; git reset -q --hard "origin/${{ github.ref_name }}"; }
            sleep $((i * 5))
          done
          exit 1
